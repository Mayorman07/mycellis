spring.application.name=monitor
spring.threads.virtual.enabled=true

# ===============================
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mycelis
spring.datasource.username=postgres
spring.datasource.password=Mayorman
# ===============================
# ===============================
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# ===============================
#Hibernate settings - S
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# ===============================


# HikariCP Connection Pool (Tuned for Virtual Threads)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ===================================================================
# MONITORING CONFIGURATION
# Externalized thresholds for health state machine and metric calculations
# ===================================================================

# Minimum health index (%) to be considered HEALTHY or STRESSED (0-100)
mycelis.monitoring.healthy-threshold=90.0
# Minimum health index (%) to be considered DEGRADED vs DORMANT (0-100)
mycelis.monitoring.degraded-threshold=1.0
# Latency threshold (ms) above which a healthy endpoint is marked STRESSED
mycelis.monitoring.latency-threshold-ms=2000
# Number of recent pulses in the sliding window for metric calculations
mycelis.monitoring.sliding-window-size=10
# Maximum consecutive failures before forcing DORMANT state
mycelis.monitoring.max-consecutive-failures=10

# Pulse retrieval limits
mycelis.monitoring.max-recent-pulses=200
mycelis.monitoring.max-history-page-size=100
mycelis.monitoring.max-error-message-length=512