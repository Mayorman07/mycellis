spring.application.name=monitor
spring.threads.virtual.enabled=true

# ===============================
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mycelis
spring.datasource.username=postgres
spring.datasource.password=Mayorman
# ===============================
# ===============================
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# ===============================
#Hibernate settings - S
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# ===============================


# HikariCP Connection Pool (Tuned for Virtual Threads)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ===================================================================
# MYCELIS MONITORING CONFIGURATION
# ===================================================================

# --- State Machine Thresholds ---
mycelis.monitoring.healthy-threshold=90.0
mycelis.monitoring.degraded-threshold=1.0
mycelis.monitoring.latency-threshold-ms=2000
mycelis.monitoring.sliding-window-size=10
mycelis.monitoring.max-consecutive-failures=10

# --- API Response Limits ---
mycelis.monitoring.max-recent-pulses=200
mycelis.monitoring.max-history-page-size=100
mycelis.monitoring.max-error-message-length=512

# --- Pulse Engine Configuration ---
mycelis.monitoring.max-cycle-duration-seconds=120
mycelis.monitoring.max-response-size-bytes=16777216
mycelis.monitoring.default-timeout-seconds=30