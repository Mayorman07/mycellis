app = 'mycellis-backend'
primary_region = 'jnb'

[build]

[env]
SPRING_PROFILES_ACTIVE = "prod"
SERVER_PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/actuator/health/readiness"

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024