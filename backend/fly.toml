# fly.toml app configuration file generated for mycellis-backend on 2026-08-06T17:56:20+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mycellis-backend'
primary_region = 'jnb'

[build]

[env]
SPRING_PROFILES_ACTIVE = "prod"
SERVER_PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
method = "GET"
timeout = "5s"
path = "/actuator/health"
port = 8081
protocol = "http"

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024