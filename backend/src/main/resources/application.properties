spring.application.name=mycelis
server.port=8080
spring.threads.virtual.enabled=true
spring.profiles.active=dev
spring.jpa.open-in-view=false

# ===============================
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mycelis
spring.datasource.username=postgres
spring.datasource.password=Mayorman
# ===============================
# ===============================
# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.flyway.baseline-description="initial"
spring.flyway.out-of-order=true
logging.level.org.flywaydb.core.internal.command.DbMigrate=DEBUG


# ===============================
# ===============================
#Hibernate settings - S
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# ===============================

# HikariCP Connection Pool (Tuned for Virtual Threads)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
logging.level.org.flywaydb=DEBUG


# ===================================================================
# ACTUATOR & METRICS CONFIGURATION
# ===================================================================

# Enable all actuator endpoints for internal monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Prometheus scraping endpoint
management.endpoints.web.base-path=/actuator

# Security: Restrict actuator to internal network only (production)
# management.server.address=127.0.0.1
# management.server.port=8081

# ===================================================================
# MYCELIS MONITORING CONFIGURATION
# ===================================================================
# --- State Machine Thresholds ---
mycelis.monitoring.healthy-threshold=90.0
mycelis.monitoring.degraded-threshold=1.0
mycelis.monitoring.latency-threshold-ms=2000

# Per-pulse latency thresholds (event-level, independent of the windowed
# latency-threshold-ms which drives stalk-aggregate state).
# Single pulses are noisier than averages so these run higher.
mycelis.monitoring.pulse-stressed-latency-ms=3000
mycelis.monitoring.pulse-degraded-latency-ms=5000

mycelis.monitoring.sliding-window-minutes=10
mycelis.monitoring.max-consecutive-failures=10

# --- API Response Limits ---
mycelis.monitoring.max-recent-pulses=200
mycelis.monitoring.max-history-page-size=100
mycelis.monitoring.max-error-message-length=512

# --- Pulse Engine Configuration ---
mycelis.monitoring.max-cycle-duration-seconds=120
mycelis.monitoring.max-response-size-bytes=16777216
mycelis.monitoring.default-timeout-seconds=30

# ===================================================================
# SCHEDULER CONFIGURATION (ISO-8601 Duration format)
# ===================================================================

# Tick interval: PT5S = 5 seconds, PT30S = 30 seconds, PT1M = 1 minute
# Also supports: 5s, 5000ms (Spring Boot relaxed binding)
mycelis.monitoring.scheduler-tick-interval=PT5S
# Max cycle duration before forced termination
mycelis.monitoring.max-cycle-duration=PT30S
# Max stalks per tick for backpressure control
mycelis.monitoring.max-batch-size=50
# Jitter percentage for thundering-herd prevention (0-50)
mycelis.monitoring.scheduler-jitter-percent=10


# ---- API path prefix (single-domain architecture) ----
#server.servlet.context-path=/api

# ---- Mail (dev = MailHog) ----
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---- Email metadata ----
mycelis.mail.from=noreply@mycellis.dev
mycelis.mail.from-name=Mycellis
mycelis.app.base-url=http://localhost:8080


# Session cookie security: base/dev-friendly defaults. Secure=false and
# SameSite=Lax only work safely because dev runs over plain HTTP on localhost.
# Production overrides these (Secure=true, SameSite=Strict) in
# application-prod.properties — see that file for the hardened settings.
#
# Default session TTL. Overridden per-session at login time when
# rememberMe=true is sent (extends to 30 days).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false