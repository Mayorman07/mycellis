mycelis.seed.super-admin.email=${MYCELIS_ADMIN_EMAIL}
mycelis.seed.super-admin.password=${MYCELIS_ADMIN_PASSWORD}
mycelis.seed.super-admin.first-name=Mayowa
mycelis.seed.super-admin.last-name=Olajide
mycelis.seed.super-admin.mobile=${MYCELIS_ADMIN_MOBILE}

# Session cookie security: explicit here (even though these already match base
# defaults) so dev's cookie posture is self-documenting and doesn't rely on
# someone reading application.properties to know it's intentionally lax.
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ---- App URLs (explicit even though matching base defaults) ----
mycelis.app.frontend-url=http://localhost:5173
mycelis.app.backend-url=http://localhost:8080

