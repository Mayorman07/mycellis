# ===================================================================
# DEV PROFILE — local development only. Not used in production.
# ===================================================================

# Empty (":") defaults here, not just on the @Value side in InitialDataSeeder —
# a property whose value is itself an unresolved nested placeholder still fails
# PlaceholderResolutionException at boot even when the *consuming* @Value has
# its own default, since that default only covers the property being entirely
# absent, not present-but-unresolvable. Verified locally: booting without
# these env vars set crashed at InitialDataSeeder bean construction until this
# was added.
mycelis.seed.super-admin.email=${MYCELIS_ADMIN_EMAIL:}
mycelis.seed.super-admin.password=${MYCELIS_ADMIN_PASSWORD:}
mycelis.seed.super-admin.first-name=Mayowa
mycelis.seed.super-admin.last-name=Olajide
mycelis.seed.super-admin.mobile=${MYCELIS_ADMIN_MOBILE:}
mycelis.email.resend.api-key=${RESEND_API_KEY:}
mycelis.email.from=${MYCELIS_EMAIL_FROM:}

# Session cookie security: explicit here (even though these already match base
# defaults) so dev's cookie posture is self-documenting and doesn't rely on
# someone reading application.properties to know it's intentionally lax.
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ---- App URLs (explicit even though matching base defaults) ----
mycelis.app.frontend-url=http://localhost:5173
mycelis.app.backend-url=http://localhost:8080

# ---- Email (still routed through MailHog — provider stays smtp via the
# base default; this is only the display From address for parity with prod) ----
#mycelis.email.from=Mycellis <noreply@send.mycellis.dev>

