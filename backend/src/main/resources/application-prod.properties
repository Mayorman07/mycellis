# ===================================================================
# PRODUCTION PROFILE  overrides only. Base defaults live in application.properties.
# All secrets come from environment variables  nothing sensitive is committed here.
# ===================================================================

# ---- Session cookie security (hardened for HTTPS production deploy) ----
# Secure=true: cookie only sent over HTTPS  would break auth entirely on
# plain-HTTP localhost, which is why dev keeps this false.
# SameSite=Strict: blocks the cookie on all cross-site requests (stronger
# than Lax, which still allows top-level navigations). Safe here because
# production is not embedding cross-site auth flows.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID
# 24 hours sessions expire after a day of inactivity.
server.servlet.session.cookie.max-age=86400

# ---- Logging (quiet in prod; dev's verbose SQL/framework logging turned off) ----
logging.level.root=WARN
logging.level.com.mycelis=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN
# Base's Flyway DEBUG logging (application.properties) isn't covered by the
# org.springframework override above — flywaydb is its own top-level package —
# so it leaks through as dev-verbose noise in prod unless overridden directly.
logging.level.org.flywaydb=WARN

# ---- Database (env-supplied  no credentials committed) ----
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ---- Hibernate ----
spring.jpa.show-sql=false

# ---- Mail (env-supplied  no credentials committed) ----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Email metadata (env-supplied) ----
# SmtpEmailService already reads these via @Value — only the base default
# (application.properties) existed before, which happened to already hold the
# right prod value. Declaring it explicitly here too, per the same
# never-rely-on-fallback rule that governs everything else in this file (the
# Commit 12b near-disaster this whole audit exists to prevent).
mycelis.mail.from=${MAIL_FROM}
mycelis.mail.from-name=${MAIL_FROM_NAME}

# ---- App URLs (env-supplied) ----
mycelis.app.frontend-url=${FRONTEND_URL}
mycelis.app.backend-url=${BACKEND_URL}
# DEPRECATED: prefer FRONTEND_URL or BACKEND_URL. Kept for backward compatibility.
mycelis.app.base-url=${APP_BASE_URL}

# ---- Actuator (bind to localhost only  never expose metrics/loggers on the
# public API port; SecurityConfig only permits health/info publicly, but
# metrics/prometheus/loggers would otherwise still be reachable on :8080 to
# any authenticated user, not just admins) ----
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=127.0.0.1

# ---- CORS (env-supplied, defaults to the production frontend origin) ----
mycelis.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mycellis.dev}

# ---- Super admin seed (InitialDataSeeder now runs in prod too — see its
# @Profile). Empty (":") defaults on the three required values so a prod boot
# with none of these set skips the seed cleanly instead of crashing at bean
# construction, same reasoning as application-dev.properties. ----
mycelis.seed.super-admin.email=${MYCELIS_ADMIN_EMAIL:}
mycelis.seed.super-admin.password=${MYCELIS_ADMIN_PASSWORD:}
mycelis.seed.super-admin.mobile=${MYCELIS_ADMIN_MOBILE:}
mycelis.seed.super-admin.first-name=${MYCELIS_ADMIN_FIRST_NAME:Admin}
mycelis.seed.super-admin.last-name=${MYCELIS_ADMIN_LAST_NAME:User}