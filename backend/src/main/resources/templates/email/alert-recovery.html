<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recovered: your stalk is back online</title>
</head>
<body style="margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#ffffff; -webkit-font-smoothing:antialiased;">

<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color:#ffffff; padding:80px 20px;">
    <tr>
        <td align="center">

            <table width="560" border="0" cellspacing="0" cellpadding="0" style="background-color:#ffffff;">

                <!-- Accent line -->
                <tr>
                    <td align="left" style="padding-bottom:40px;">
                        <table border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td width="40" style="height:2px; background-color:#0d7377; line-height:2px; font-size:2px;">&nbsp;</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Wordmark -->
                <tr>
                    <td align="left" style="padding-bottom:20px;">
                        <h1 style="color:#0d7377; margin:0; font-size:14px; font-weight:800; letter-spacing:3px; text-transform:uppercase; line-height:1;">MYCELLIS</h1>
                    </td>
                </tr>

                <!-- Headline + intro -->
                <tr>
                    <td align="left" style="padding-bottom:50px;">
                        <h2 style="color:#0d7377; margin:0 0 16px 0; font-size:26px; font-weight:700; letter-spacing:-0.02em; line-height:1.2;">
                            <span th:text="${nickname}">Your stalk</span> is back online.
                        </h2>
                        <p style="color:#4a6566; font-size:16px; margin:0; line-height:1.6; max-width:460px;">
                            It was down for <span th:text="${duration}" style="color:#0a2e2f; font-weight:600;">a while</span>. We'll let you know if it goes down again.
                        </p>
                    </td>
                </tr>

                <!-- Info block -->
                <tr>
                    <td align="left" style="padding-bottom:50px; border-top:1px solid #d8e8e8; padding-top:40px;">
                        <p style="font-size:12px; color:#8aa6a7; margin:0 0 8px 0; text-transform:uppercase; letter-spacing:1px;">Target</p>
                        <p style="font-size:14px; color:#0a2e2f; margin:0; word-break:break-all; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;"
                           th:text="${url}">
                            https://example.com
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="left" style="border-top:1px solid #d8e8e8; padding-top:40px;">
                        <table width="100%" border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td align="left">
                                    <p style="font-size:12px; color:#8aa6a7; margin:0; line-height:1.6;">
                                        &copy; 2026 Mycellis.<br>
                                        Watch your services breathe.
                                    </p>
                                </td>
                                <td align="right" valign="bottom">
                                    <p style="font-size:12px; margin:0;">
                                        <a href="#" style="color:#0a2e2f; text-decoration:none; font-weight:700; margin-left:20px;">Support</a>
                                        <a href="#" style="color:#0a2e2f; text-decoration:none; font-weight:700; margin-left:20px;">Policies</a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
